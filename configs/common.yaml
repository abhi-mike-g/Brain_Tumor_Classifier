# Shared by ALL four members (MLP, ResNet18, CNN-LSTM, ViT).
# Changing anything here changes the experiment for everyone, so agree on it as a team
# and commit it once. Model-specific settings go in configs/<model>.yaml.

seed: 42
classes: [glioma, meningioma, notumor, pituitary]

data:
  raw_dir: data/raw                  # Kaggle folder layout: Training/<class>/*.jpg, Testing/<class>/*.jpg
  inventory_csv: splits/inventory.csv
  split_csv: splits/split.csv        # THE fixed split. Commit this file; everyone reads it.
  # Regex matched against the file name. Files that match are dropped before splitting.
  # Leave null until `python -m btc.audit` tells you whether synthetic/augmented copies exist.
  exclude_name_regex: "aug"           # e.g. "aug" (case-insensitive)

image:
  size: 224                          # square resize, same for every model
  mean: [0.485, 0.456, 0.406]        # ImageNet stats (needed for pretrained ResNet18/ViT)
  std: [0.229, 0.224, 0.225]

split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  # Two images are "the same scan" if their 64-bit dHash differs in <= this many bits.
  # Images in the same group always land in the same split (prevents leakage).
  dup_hamming_threshold: 2

augment:                             # TRAIN ONLY. val/test get resize + normalize only.
  rotation_deg: 10
  hflip_p: 0.5
  crop_scale_min: 0.85
